name: Validar V2M
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - uses: actions/upload-artifact@v4
        with:
          name: v2m-build-${{ github.sha }}
          path: dist/
          include-hidden-files: true
          retention-days: 7
